<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recette partagée · Mon Carnet Gourmand</title><link rel="stylesheet" href="deluxe.css"><style>body{margin:0;padding:20px}main{max-width:720px;margin:auto;background:white;border-radius:26px;padding:22px}img{max-width:100%;border-radius:20px}label{display:block;padding:8px}li{margin:12px 0}input[type=checkbox]{width:20px;height:20px}a{color:#85428d}</style><main><img src="biscotte.svg" width="90" alt="Biscotte"><h2>Mon Carnet Gourmand</h2><div id="recipe" role="status">Chargement de la recette…</div></main><script src="portions.js"></script><script>const p=new URLSearchParams(location.search),root=document.querySelector('#recipe');const add=(tag,text,parent=root)=>{const e=document.createElement(tag);e.textContent=text;parent.append(e);return e};(async()=>{try{const api=new URL(p.get('api')||'https://mon-carnet-gourmand.onrender.com');if(api.protocol!=='https:')throw Error();const res=await fetch(api.origin+'/shares/'+encodeURIComponent(p.get('id')||''));if(!res.ok)throw Error();const {recipe:r}=await res.json();root.replaceChildren();add('h1',r.title);if(/^(https:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(r.photo)){const im=add('img','');im.src=r.photo;im.alt=r.title}add('p',[r.category,r.servings&&r.servings+' portions',r.prep&&'Préparation '+r.prep+' min',r.cook&&'Cuisson '+r.cook+' min',r.rest&&'Repos '+r.rest+' min',r.temp&&r.temp+' °C'].filter(Boolean).join(' · '));const heading=add('h2','Ingrédients');const labels=[];r.ingredients.split('\n').filter(Boolean).forEach(t=>{const l=add('label','');const c=add('input','',l);c.type='checkbox';const span=add('span',' '+t,l);labels.push(span)});PortionTools.mount(heading,r,a=>a.ingredients.split('\n').filter(Boolean).forEach((t,i)=>{if(labels[i])labels[i].textContent=' '+t}));add('h2','Préparation');const ol=add('ol','');r.steps.split('\n').filter(Boolean).forEach(t=>add('li',t,ol));if(r.notes){add('h2','Notes');add('p',r.notes)}if(/^https:\/\//i.test(r.source)){const a=add('a','Voir la source');a.href=r.source;a.rel='noopener noreferrer'}}catch{root.textContent='Cette fiche est indisponible. Réessaie dans quelques instants.'}})();</script></html>
